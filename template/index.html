<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Google Ad Manager
</title>

<style>
	

	body {

    font-family: Arial;

    background-color: #f5f5f5;

    margin: 0;
}

.container {

    width: 600px;

    margin: 50px auto;

    background: white;

    padding: 30px;

    border-radius: 10px;

    box-shadow:
    0 0 10px
    rgba(0,0,0,.1);
}

h1 {

    text-align: center;
}

label {

    display: block;

    margin-top: 15px;
}

input {

    width: 100%;

    padding: 10px;

    margin-top: 5px;

    box-sizing: border-box;
}

button {

    margin-top: 20px;

    width: 100%;

    padding: 12px;

    background: #4285F4;

    color: white;

    border: none;

    cursor: pointer;

    font-size: 16px;
}

button:hover {

    background: #2d6de6;
}

.success {

    margin-top: 20px;

    color: green;

    font-weight: bold;
}

.error {

    margin-top: 20px;

    color: red;

    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<h1>
Copiar Configuração Line Item
</h1>

<form id="copyForm">

<label>
Line Item Origem
</label>

<input
id="source"
type="number"
name="source_id"
required>

<label>
Line Item Destino
</label>

<input
id="target"
type="number"
name="target_id"
required>

<button type="submit">

Copiar Configuração

</button>

</form>

<div id="resultado"></div>

</div>

<script>

document
.getElementById(
"copyForm"
)
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const formData =
new FormData(this);

const response =
await fetch(
"/copiar",
{
method:"POST",
body:formData
}
);

const result =
await response.json();

const resultado =
document.getElementById(
"resultado"
);

resultado.innerHTML =
result.message;

if(result.success){

resultado.className =
"success";

}else{

resultado.className =
"error";
}

});

</script>

</body>

</html>
